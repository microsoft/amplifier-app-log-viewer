<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Amplifier Log Viewer</title>
    <style>
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        form {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 2em;
            width: 280px;
        }
        h1 { font-size: 1.1em; margin: 0 0 1em; }
        label { display: block; font-size: 0.85em; color: #8b949e; margin: 0.75em 0 0.25em; }
        input[type="text"], input[type="password"] {
            width: 100%; box-sizing: border-box; padding: 0.5em;
            background: #0d1117; border: 1px solid #30363d; border-radius: 4px;
            color: #e6edf3; font-size: 1em;
        }
        button {
            width: 100%; margin-top: 1.25em; padding: 0.6em;
            background: #58a6ff; color: #0d1117; border: none; border-radius: 4px;
            font-weight: 600; cursor: pointer;
        }
        button:hover { background: #79c0ff; }
        .hint { color: #8b949e; font-size: 0.8em; margin-top: 1em; }
        .error { color: #ff7b72; font-size: 0.85em; margin-top: 0.75em; }
    </style>
</head>
<body>
    <form method="post" action="{{ BASE_PATH }}/login">
        <h1>Amplifier Log Viewer</h1>
        {% if mode == "pam" %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ expected_username }}">
        {% endif %}
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autofocus required>
        <input type="hidden" name="next" value="{{ next }}">
        {% if error %}
        <p class="error">Incorrect credentials.</p>
        {% endif %}
        <button type="submit">Sign in</button>
        {% if mode == "pam" %}
        <p class="hint">Sign in as {{ expected_username }} (this host's system password).</p>
        {% endif %}
    </form>
</body>
</html>
