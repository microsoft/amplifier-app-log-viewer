[project]
name = "amplifier-app-log-viewer"
version = "0.1.0"
description = "Web-based log viewer for Amplifier sessions"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "click>=8.0.0",
    "waitress>=3.0.0",
    "python-pam>=1.8.4",
    # python-pam 2.x's __internals module imports `six` but does not declare
    # it in its own package metadata (upstream packaging gap) -- without this,
    # `import pam` raises ModuleNotFoundError on a clean install.
    "six>=1.16.0",
]

[project.scripts]
amplifier-log-viewer = "amplifier_app_log_viewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

